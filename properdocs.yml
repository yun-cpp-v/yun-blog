site_name: ゆんのブログ
site_url: https://yun-cpp-v.github.io/yun-blog/
site_dir: build/site
site_description: Twitterに書くには長すぎる，ゆんのひとりごとを載せるブログ．


repo_url: https://github.com/yun-cpp-v/yun-blog
repo_name: yun-cpp-v/yun-blog

plugins:
  - search
  - awesome-pages
  - ruby:
      global_enable: false
      title_enable: false
      outer_begin: '{'
      outer_end: '}'
      inter_begin: '_'
      inter_end: '_'

theme:
  name: material
  custom_dir: overrides
  language: ja
  palette:
    primary: deep-purple
    accent: blue
  features:
    - navigation.tabs

markdown_extensions:
  - admonition
  - def_list
  - attr_list
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
